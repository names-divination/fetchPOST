<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTTP Fetch Tester</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#e8ecf7;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1100px;margin:32px auto;padding:0 18px}
h1{font-size:24px;margin:0 0 6px}
.note{color:#9ca8c4;font-size:13px;margin-bottom:20px}
.panel{background:#121a2d;border:1px solid #273452;border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center}
select,input,textarea,button{font:inherit;border-radius:8px;border:1px solid #344363;background:#0d1527;color:#eef2ff}
input,select{height:42px;padding:0 12px}
#url{flex:1}
button{height:42px;padding:0 18px;cursor:pointer}
button:hover{background:#19243d}
button.primary{background:#3159b7;border-color:#4770d0}
button.primary:hover{background:#3c68cc}
textarea{width:100%;min-height:150px;padding:12px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}
.small{font-size:12px;color:#9ca8c4;margin:7px 0}
.status{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tab{height:34px;padding:0 12px}
pre{margin:0;white-space:pre-wrap;word-break:break-word;max-height:600px;overflow:auto;font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}
table{width:100%;border-collapse:collapse;font-size:13px}
td{border-bottom:1px solid #26324b;padding:7px;text-align:left;vertical-align:top}
td:first-child{width:30%;color:#9fb0d2}
.error{color:#ff9b9b}
@media(max-width:700px){.row{flex-wrap:wrap}#url{flex-basis:100%}button{flex:1}}
</style>
</head>
<body>
<main>
<h1>HTTP Fetch Tester</h1>
<div class="note">GET / POST / PUT / PATCH / DELETE / HEAD / OPTIONS 対応。入力したヘッダーとBodyを基本的にそのままWorkerへ渡します。</div>

<div class="panel">
  <div class="row">
    <select id="method">
      <option>GET</option><option>POST</option><option>PUT</option>
      <option>PATCH</option><option>DELETE</option><option>HEAD</option><option>OPTIONS</option>
    </select>
    <input id="url" type="url" placeholder="https://example.com/api" autocomplete="off">
    <button class="primary" id="send">送信</button>
  </div>
  <div class="small">Worker URLを下の設定に入れてください。</div>
</div>

<div class="panel">
  <b>リクエストヘッダー</b>
  <div class="small">1行1ヘッダー。例: Content-Type: application/json</div>
  <textarea id="headers" spellcheck="false" placeholder="Content-Type: application/json&#10;Authorization: Bearer ...&#10;X-Test: hello"></textarea>
</div>

<div class="panel">
  <b>リクエストBody</b>
  <div class="small">GET / HEADでは通常不要。文字列として入力した内容を送信します。</div>
  <textarea id="body" spellcheck="false" placeholder='{"hello":"world"}'></textarea>
</div>

<div class="panel">
  <b>Worker設定</b>
  <div class="small">WorkerのURLと専用キー。キーはブラウザ内に保存しません。</div>
  <input id="worker" type="url" style="width:100%;margin-bottom:8px" placeholder="https://your-worker.your-subdomain.workers.dev">
  <input id="key" type="password" style="width:100%" placeholder="専用アクセスキー">
</div>

<div class="panel">
  <b>レスポンス</b>
  <div id="status" class="status">未送信</div>
</div>

<div class="panel">
  <div class="tabs">
    <button class="tab" data-tab="bodyout">本文</button>
    <button class="tab" data-tab="headersout">ヘッダー</button>
  </div>
  <pre id="bodyout"></pre>
  <div id="headersout" hidden></div>
</div>
</main>

<script>
const $=id=>document.getElementById(id);
const escName=/^[A-Za-z0-9!#$%&'*+\-.^_`|~]+$/;

function parseHeaders(text){
  const h={};
  for(const line of text.split(/\r?\n/)){
    if(!line.trim()) continue;
    const p=line.indexOf(":");
    if(p<=0) throw new Error("ヘッダー形式が不正: "+line);
    const name=line.slice(0,p).trim();
    const value=line.slice(p+1).trim();
    if(!escName.test(name)) throw new Error("ヘッダー名が不正: "+name);
    h[name]=value;
  }
  return h;
}

function pretty(text, contentType){
  if((contentType||"").toLowerCase().includes("json")){
    try{return JSON.stringify(JSON.parse(text),null,2)}catch{}
  }
  return text;
}

$("send").onclick=async()=>{
  const status=$("status"), out=$("bodyout"), hout=$("headersout");
  status.textContent="送信中...";
  out.textContent="";
  hout.innerHTML="";
  try{
    const worker=$("worker").value.trim();
    const key=$("key").value;
    const target=$("url").value.trim();
    if(!worker) throw new Error("Worker URLを入力してください。");
    if(!key) throw new Error("専用アクセスキーを入力してください。");
    if(!/^https?:\/\//i.test(target)) throw new Error("URLはhttp://またはhttps://から入力してください。");

    const method=$("method").value;
    const headers=parseHeaders($("headers").value);
    const options={method,headers:{
      "X-Fetch-Tester-Key":key,
      "X-Target-URL":target,
      ...headers
    }};
    if(!["GET","HEAD"].includes(method)) options.body=$("body").value;

    const r=await fetch(worker,options);
    const text=await r.text();
    const ct=r.headers.get("content-type")||"";
    status.textContent=`Status: ${r.status} ${r.statusText}\nContent-Type: ${ct}`;
    out.textContent=pretty(text,ct);

    const rows=[];
    r.headers.forEach((v,k)=>rows.push(`<tr><td>${k.replaceAll("&","&amp;").replaceAll("<","&lt;")}</td><td>${v.replaceAll("&","&amp;").replaceAll("<","&lt;")}</td></tr>`));
    hout.innerHTML="<table>"+rows.join("")+"</table>";
  }catch(e){
    status.innerHTML='<span class="error">Error: '+String(e.message||e).replaceAll("&","&amp;").replaceAll("<","&lt;")+'</span>';
  }
};

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  const isBody=b.dataset.tab==="bodyout";
  $("bodyout").hidden=!isBody;
  $("headersout").hidden=isBody;
});
</script>
</body>
</html>
